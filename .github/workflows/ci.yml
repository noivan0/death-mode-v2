name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt flake8 pytest
      - name: Flake8
        # .flake8 excludes NostalgiaForInfinityX7.py (pyflakes RecursionError on 3.4MB file)
        run: flake8 . --count --show-source --statistics
      - name: Cardinal risk tests
        run: pytest tests/ -q
      - name: Check imports
        run: python scripts/ci_check_imports.py

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON configs
        run: |
          set -euo pipefail
          fail=0
          # Runtime / paper JSON (must be strict JSON)
          for f in config/*.json; do
            [ -f "$f" ] || continue
            if grep -q '\${' "$f"; then
              echo "SKIP (unexpanded envsubst placeholders): $f"
              continue
            fi
            if python -m json.tool "$f" > /dev/null; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              fail=1
            fi
          done
          # Templates: substitute ${...} with JSON-safe placeholders then parse
          for f in config/*.json.template; do
            [ -f "$f" ] || continue
            tmp="$(mktemp)"
            # Unquoted ${VAR:-123} → 0 ; quoted "${VAR}" → ""
            sed -E \
              -e 's/"\$\{[^}]+\}"/""/g' \
              -e 's/\$\{[^}]+\}/0/g' \
              "$f" > "$tmp"
            if python -m json.tool "$tmp" > /dev/null; then
              echo "OK: $f (envsubst-dry)"
            else
              echo "FAIL: $f"
              fail=1
            fi
            rm -f "$tmp"
          done
          exit "$fail"
