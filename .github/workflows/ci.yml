name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt flake8 pytest
      - name: Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Cardinal risk tests
        run: pytest tests/ -q
      - name: Check imports
        run: python scripts/ci_check_imports.py

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON configs
        run: |
          for f in config/*.json config/*.json.template; do
            python -m json.tool "$f" > /dev/null 2>&1 && echo "OK: $f" || echo "FAIL: $f"
          done
