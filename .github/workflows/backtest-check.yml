name: Backtest Health Check

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Freqtrade
        run: |
          git clone https://github.com/freqtrade/freqtrade.git /tmp/freqtrade
          cd /tmp/freqtrade && pip install -e .
      - name: Quick backtest sanity check
        run: |
          cd /mnt/d/death-mode-v2
          freqtrade backtesting --config config/sharp_backtest.json \
            --strategy DeathModeV2_NFI \
            --strategy-path user_data/strategies/ \
            --timerange 20250101-20250201 \
            --max-open-trades 3 \
            --dry-run-wallet 10000 2>&1 | tail -20
