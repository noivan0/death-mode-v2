name: Backtest Health Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate strategy files
        run: |
          python3 -m py_compile user_data/strategies/DeathModeV2_NFI.py
          python3 -m py_compile user_data/strategies/DeathModeV2_Base.py
          python3 -m py_compile user_data/strategies/DeathModeV2_Sharp.py
          echo "✅ All strategies pass syntax check"
